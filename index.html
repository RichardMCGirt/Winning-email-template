<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Email Template</title>
  <link rel="stylesheet" href="style.css">
  <meta http-equiv="Content-Security-Policy"
        content="script-src 'self' https://www.gstatic.com https://apis.google.com https://accounts.google.com 'unsafe-inline' 'unsafe-eval';">
</head>

<body>
  <!-- ========== DARK MODE TOGGLE ========== -->
  <div class="dark-mode-toggle">
    <label class="switch">
      <input type="checkbox" id="toggleDarkMode">
      <span class="slider"></span>
    </label>
    <span id="toggleLabel">Dark Mode</span>
  </div>
<!-- Refresh control + status line -->
<div class="fetch-controls" id="fetchControls" style="margin:12px 0;display:flex;align-items:center;gap:10px;flex-wrap:wrap;">
  <button id="refreshBidsBtn" type="button" class="btn" aria-label="Refresh bid list">Refresh Bids</button>
  <span id="dataStatus" class="muted-sm" aria-live="polite"></span>
</div>

  <!-- ========== EMAIL TEMPLATE OUTPUT ========== -->
  <div id="emailTemplate"></div>

  <!-- ========== HIDDEN ACTION BUTTONS ========== -->
  <button id="sendVendorEmailButton" style="display:none;"></button>
  <button id="sendManagementEmailButtonReal" style="display:none;"></button>
  <button id="sendSubcontractorEmailButton" style="display:none;"></button>

  <!-- ========== EMAIL OPTIONS PANEL ========== -->
  <section id="emailOptions" style="margin: 20px 0;">
    <label>
      <input type="checkbox" id="optionManagement" checked />
      Send Management Email
    </label>
    <br>
    <label>
      <input type="checkbox" id="optionSubcontractor" checked />
      Send Subcontractor Email(s)
    </label>
    <br>
    <label>
      <input type="checkbox" id="optionSendBlankSubEmail" />
      Send empty Subcontractor Email
    </label>
    <br>
    <div id="blankSubEmailMessage" style="display:none; color: lightgray; font-size: 14px; margin-top: 5px;">
      ⚠️ You will need to manually copy and paste subcontractor emails to avoid launching multiple batches of 30.
    </div>
    <div id="spanLoadingOverlay"
         style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.4); z-index:9999; justify-content:center; align-items:center; color:white; font-size:24px;">
      <div>⏳ Populating template...</div>
    </div>
    <label>
      <input type="checkbox" id="optionVendor" checked />
      Send Vendor Email
    </label>
    <br>
    <button id="sendSelectedEmails">Send Selected Emails</button>
  </section>

  <!-- ========== UTILITY CONTROLS ========== -->
  <button id="clearCacheBtn">Clear Cached Data</button>

  <!-- ========== DYNAMIC CONTENT ========== -->
  <div id="dynamicContainer"></div>

  <!-- ========== GOOGLE APIs (EXTERNAL) ========== -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="https://apis.google.com/js/api.js"></script>

  <!-- ========== APP SCRIPTS ========== -->
  <script src="js/script.js"></script>
  <script src="js/darkmode.js"></script>
  <script src="js/password.js"></script>
    <script src="js/blanksub.js"></script>
<script src="js/flagbid.js"></script>

<script>
  // Base/table can already be present in your app; only set if missing:
  window.baseId = 'appK9gZS77OmsIK50';      // your Bid Board base
  window.tableId = "tblQo2148s04gVPq1";     // your Bids table
  // If you call Airtable from the browser, expose a PAT (dev only) or use your existing global:
   window.airtableApiKey =  'patCnUsdz4bORwYNV.5c27cab8c99e7caf5b0dc05ce177182df1a9d60f4afc4a5d4b57802f44c65328'; // avoid in production — prefer server proxy

  // Force the exact checkbox field (from your screenshot):
  window.EMAIL_FLAG_CHECKBOX_FIELD = "Used for email winning email template";
</script>


</body>

</html>
